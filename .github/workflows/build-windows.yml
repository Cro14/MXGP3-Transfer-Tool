name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Syntax check
        run: python -m py_compile mxgp3_transfer_tool.py

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MXGP3_Transfer_Tool_v0.2 mxgp3_transfer_tool.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MXGP3_Transfer_Tool_v0.2
          path: dist/MXGP3_Transfer_Tool_v0.2.exe
          if-no-files-found: error

      - name: Publish direct EXE download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2-pak"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/MXGP3_Transfer_Tool_v0.2.exe" --clobber
          } else {
            gh release create $tag "dist/MXGP3_Transfer_Tool_v0.2.exe" --title "MXGP3 Transfer Tool v0.2 PAK Test" --notes "Test build that edits the MXGP3 SQLite database, creates an override PAK at the original internal database path, and installs it into the game's Content/Paks folder. Requires UnrealPak.exe from the user's existing UnrealPak tools." --target "${{ github.sha }}"
          }
