name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Syntax check
        run: python -m py_compile mxgp3_transfer_tool.py

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MXGP3_Transfer_Tool_v0.3 mxgp3_transfer_tool.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MXGP3_Transfer_Tool_v0.3
          path: dist/MXGP3_Transfer_Tool_v0.3.exe
          if-no-files-found: error

      - name: Publish direct EXE download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3-auto-replace"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/MXGP3_Transfer_Tool_v0.3.exe" --clobber
          } else {
            gh release create $tag "dist/MXGP3_Transfer_Tool_v0.3.exe" --title "MXGP3 Transfer Tool v0.3 Auto Replace" --notes "One-click test build: edits the rider team assignment, rebuilds a high-priority pakchunk99 override, automatically replaces the previous Transfer Tool PAK, verifies the installed PAK, and rolls the DB back if installation fails. Requires UnrealPak.exe from the user's existing tools." --target "${{ github.sha }}"
          }
