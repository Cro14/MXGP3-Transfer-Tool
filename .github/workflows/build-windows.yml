name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Download repak for Windows
        shell: pwsh
        run: |
          $url = "https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile repak.zip
          Expand-Archive -Path repak.zip -DestinationPath repak_dist -Force
          $repak = Get-ChildItem -Path repak_dist -Recurse -Filter "repak.exe" | Select-Object -First 1
          if (-not $repak) { throw "repak.exe not found in downloaded archive" }
          Copy-Item $repak.FullName .\repak.exe -Force
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/trumank/repak/master/LICENSE-MIT" -OutFile repak-LICENSE-MIT.txt
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/trumank/repak/master/LICENSE-APACHE" -OutFile repak-LICENSE-APACHE.txt
          .\repak.exe --version

      - name: Syntax check
        run: python -m py_compile mxgp3_transfer_tool_v05.py

      - name: Build self-contained EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name MXGP3_Transfer_Tool_v0.5 `
            --add-binary "repak.exe;." `
            --add-data "repak-LICENSE-MIT.txt;licenses" `
            --add-data "repak-LICENSE-APACHE.txt;licenses" `
            mxgp3_transfer_tool_v05.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MXGP3_Transfer_Tool_v0.5
          path: dist/MXGP3_Transfer_Tool_v0.5.exe
          if-no-files-found: error

      - name: Publish direct EXE download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.5-full-transfer"
          $exe = "dist/MXGP3_Transfer_Tool_v0.5.exe"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --title "MXGP3 Transfer Tool v0.5 Full Transfer" --notes "Test build with a fuller MXGP3 transfer mechanism: updates Pilots.Teams_Key, syncs rider bike manufacturer from the destination team, rebuilds official visual filters for team suit/livery and bike parts, creates a canonical high-priority pakchunk0-WindowsNoEditor_999_P.pak patch, and reads the installed patch DB back to verify the requested transfer is physically inside the PAK." --target "${{ github.sha }}"
          }
